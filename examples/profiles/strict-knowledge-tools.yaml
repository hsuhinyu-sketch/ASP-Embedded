# Cargo features: gateway-rag,gateway-llm,gateway-mcp,security-s1,tls-aws-lc
# Setup and port map: docs/README.md#安全网关场景-profile
config:
  bindAddress: 127.0.0.1
  management:
    mode: edge
  securityAudit:
    directory: ${AISP_EXAMPLE_STATE_DIR}/strict-knowledge-tools/audit
aiSystems:
  - name: strict-knowledge-tools
    security:
      mode: enforce
      requiredIdentity:
        user: true
        tenant: true
        agent: false
      requiredAudit:
        actionTypes:
          - modelInvoke
          - toolInvoke
          - knowledgeIngest
          - knowledgeRetrieve
      policies:
        - id: invoke-model
          tenantId: tenant-a
          actionType: modelInvoke
          effect: allow
          enabled: true
          resourceId: local-model
        - id: use-tool-session
          tenantId: tenant-a
          actionType: mcpSessionOperation
          effect: allow
          enabled: true
        - id: list-tools
          tenantId: tenant-a
          actionType: toolList
          effect: allow
          enabled: true
        - id: ping-tool-server
          tenantId: tenant-a
          actionType: mcpOperation
          effect: allow
          enabled: true
          actionName: ping
          resourceType: mcpServer
          resourceId: local
        - id: invoke-echo
          tenantId: tenant-a
          actionType: toolInvoke
          effect: allow
          enabled: true
          resourceId: echo
        - id: ingest-documents
          tenantId: tenant-a
          actionType: knowledgeIngest
          effect: allow
          enabled: true
          userId: operator-a
        - id: retrieve-knowledge
          tenantId: tenant-a
          actionType: knowledgeRetrieve
          effect: allow
          enabled: true
        - id: assemble-context
          tenantId: tenant-a
          actionType: contextAssemble
          effect: allow
          enabled: true
        - id: revoke-context
          tenantId: tenant-a
          actionType: contextOperation
          effect: allow
          enabled: true
      mcpSessions:
        maxSessions: 64
        maxStreams: 32
      dependencyEgress:
        requireTls: false
        destinations:
          embedding:
            - 127.0.0.1:18001
          qdrant:
            - 127.0.0.1:6333
      crossComponent:
        namespace: strict-knowledge-tools
        ttlSeconds: 300
        maxContexts: 128
        storage:
          path: ${AISP_EXAMPLE_STATE_DIR}/strict-knowledge-tools/contexts.jsonl
          maxBytes: 16777216
        destinations:
          - classification: public
            modelDestinations:
              - 127.0.0.1:18000
            toolDestinations:
              - local/echo
          - classification: internal
            modelDestinations:
              - 127.0.0.1:18000
            toolDestinations:
              - local/echo
          - classification: restricted
            modelDestinations:
              - 127.0.0.1:18000
            toolDestinations:
              - local/echo
        restrictUntrustedPayloads: true
    llm:
      port: 14100
      policies:
        jwtAuth: &strict-jwt
          mode: strict
          issuer: ${AISP_EXAMPLE_ISSUER}
          audiences:
            - strict-knowledge-tools
          jwks:
            file: ${AISP_EXAMPLE_JWKS_FILE}
      models:
        - name: local-model
          provider: openAI
          params:
            baseUrl: http://127.0.0.1:18000/v1
    mcp:
      port: 14102
      statefulMode: stateful
      policies:
        jwtAuth: *strict-jwt
      targets:
        - name: local
          mcp:
            host: http://127.0.0.1:18200/mcp
    rag:
      port: 14103
      authentication: *strict-jwt
      qdrant:
        endpoint: http://127.0.0.1:6333
        collection: strict-knowledge-tools
        quarantineCollection: strict-knowledge-tools-quarantine
        defaultChunkAccess:
          allowTenantAuthenticated: true
        integrity:
          keyId: strict-knowledge-tools
          keyEnvVar: AISP_EXAMPLE_VECTOR_KEY
      embedding:
        endpoint: http://127.0.0.1:18001/v1/embeddings
        model: local-embedding
      lifecycle:
        namespace: strict-knowledge-tools
        storage:
          path: ${AISP_EXAMPLE_STATE_DIR}/strict-knowledge-tools/documents.jsonl
          maxBytes: 16777216
      contextGuard:
        mode: enforce
        ruleSet: contextual
