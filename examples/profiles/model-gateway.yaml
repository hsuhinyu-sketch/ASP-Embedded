# Cargo features: gateway-llm,security-s1,tls-aws-lc
# Setup and port map: docs/README.md#安全网关场景-profile
config:
  bindAddress: 127.0.0.1
  management:
    mode: edge
  securityAudit:
    directory: ${AISP_EXAMPLE_STATE_DIR}/model-gateway/audit
aiSystems:
  - name: model-gateway
    security:
      mode: enforce
      requiredIdentity:
        user: true
        tenant: true
        agent: false
      requiredAudit:
        actionTypes:
          - modelInvoke
      policies:
        - id: invoke-model
          tenantId: tenant-a
          actionType: modelInvoke
          effect: allow
          enabled: true
          resourceId: local-model
      dataEgress:
        classification: internal
        modelDestinations:
          - 127.0.0.1:18000
    llm:
      port: 14100
      policies:
        jwtAuth:
          mode: strict
          issuer: ${AISP_EXAMPLE_ISSUER}
          audiences:
            - model-gateway
          jwks:
            file: ${AISP_EXAMPLE_JWKS_FILE}
      models:
        - name: local-model
          provider: openAI
          params:
            baseUrl: http://127.0.0.1:18000/v1
