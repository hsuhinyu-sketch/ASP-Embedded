# Cargo features: gateway-rag,gateway-llm,security-s1,tls-aws-lc
# Setup and port map: docs/README.md#安全网关场景-profile
config:
  bindAddress: 127.0.0.1
  management:
    mode: edge
  securityAudit:
    directory: ${AISP_EXAMPLE_STATE_DIR}/knowledge-assistant/audit
aiSystems:
  - name: knowledge-assistant
    security:
      mode: enforce
      requiredIdentity:
        user: true
        tenant: true
        agent: false
      requiredAudit:
        actionTypes:
          - modelInvoke
          - knowledgeIngest
          - knowledgeRetrieve
      policies:
        - id: invoke-model
          tenantId: tenant-a
          actionType: modelInvoke
          effect: allow
          enabled: true
          resourceId: local-model
        - id: ingest-documents
          tenantId: tenant-a
          actionType: knowledgeIngest
          effect: allow
          enabled: true
          userId: operator-a
        - id: retrieve-knowledge
          tenantId: tenant-a
          actionType: knowledgeRetrieve
          effect: allow
          enabled: true
        - id: assemble-context
          tenantId: tenant-a
          actionType: contextAssemble
          effect: allow
          enabled: true
        - id: revoke-context
          tenantId: tenant-a
          actionType: contextOperation
          effect: allow
          enabled: true
      dependencyEgress:
        requireTls: false
        destinations:
          embedding:
            - 127.0.0.1:18001
          qdrant:
            - 127.0.0.1:6333
      crossComponent:
        namespace: knowledge-assistant
        ttlSeconds: 300
        maxContexts: 128
        storage:
          path: ${AISP_EXAMPLE_STATE_DIR}/knowledge-assistant/contexts.jsonl
          maxBytes: 16777216
        destinations:
          - classification: public
            modelDestinations:
              - 127.0.0.1:18000
          - classification: internal
            modelDestinations:
              - 127.0.0.1:18000
          - classification: restricted
            modelDestinations:
              - 127.0.0.1:18000
    llm:
      port: 14100
      policies:
        jwtAuth: &strict-jwt
          mode: strict
          issuer: ${AISP_EXAMPLE_ISSUER}
          audiences:
            - knowledge-assistant
          jwks:
            file: ${AISP_EXAMPLE_JWKS_FILE}
      models:
        - name: local-model
          provider: openAI
          params:
            baseUrl: http://127.0.0.1:18000/v1
    rag:
      port: 14103
      authentication: *strict-jwt
      qdrant:
        endpoint: http://127.0.0.1:6333
        collection: knowledge-assistant
        quarantineCollection: knowledge-assistant-quarantine
        defaultChunkAccess:
          allowTenantAuthenticated: true
        integrity:
          keyId: knowledge-assistant
          keyEnvVar: AISP_EXAMPLE_VECTOR_KEY
      embedding:
        endpoint: http://127.0.0.1:18001/v1/embeddings
        model: local-embedding
      lifecycle:
        namespace: knowledge-assistant
        storage:
          path: ${AISP_EXAMPLE_STATE_DIR}/knowledge-assistant/documents.jsonl
          maxBytes: 16777216
      contextGuard:
        mode: enforce
        ruleSet: contextual
