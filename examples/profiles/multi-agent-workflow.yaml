# Cargo features: gateway-rag,gateway-llm,gateway-mcp,gateway-a2a,security-s1,security-a2a-sqlite,tls-aws-lc
# Setup and port map: docs/README.md#安全网关场景-profile
config:
  bindAddress: 127.0.0.1
  management:
    mode: edge
  securityAudit:
    directory: ${AISP_EXAMPLE_STATE_DIR}/multi-agent-workflow/audit
aiSystems:
  - name: multi-agent-workflow
    security:
      mode: enforce
      requiredIdentity:
        user: true
        tenant: true
        agent: true
      agentIdentity:
        required: true
        agents:
          - agentId: workflow-agent
            tenantId: tenant-a
            clientIds: [workflow-client]
            enabled: true
      requiredAudit:
        actionTypes:
          - modelInvoke
          - toolInvoke
          - agentInvoke
          - knowledgeIngest
          - knowledgeRetrieve
      policies:
        - id: invoke-model
          tenantId: tenant-a
          actionType: modelInvoke
          effect: allow
          enabled: true
          resourceId: local-model
        - id: use-tool-session
          tenantId: tenant-a
          actionType: mcpSessionOperation
          effect: allow
          enabled: true
        - id: list-tools
          tenantId: tenant-a
          actionType: toolList
          effect: allow
          enabled: true
        - id: ping-tool-server
          tenantId: tenant-a
          actionType: mcpOperation
          effect: allow
          enabled: true
          actionName: ping
          resourceType: mcpServer
          resourceId: local
        - id: invoke-echo
          tenantId: tenant-a
          actionType: toolInvoke
          effect: allow
          enabled: true
          resourceId: echo
        - id: invoke-fixed-agent
          tenantId: tenant-a
          actionType: agentInvoke
          effect: allow
          enabled: true
          resourceType: agent
          resourceId: 127.0.0.1:18100
        - id: create-own-task
          tenantId: tenant-a
          actionType: agentTaskOperation
          effect: allow
          enabled: true
          actionName: create
          resourceType: agent
          resourceId: '["127.0.0.1:18100","/"]'
        - id: read-own-task
          tenantId: tenant-a
          actionType: agentTaskOperation
          effect: allow
          enabled: true
          actionName: read
          resourceType: agentTask
        - id: ingest-documents
          tenantId: tenant-a
          actionType: knowledgeIngest
          effect: allow
          enabled: true
          userId: operator-a
        - id: retrieve-knowledge
          tenantId: tenant-a
          actionType: knowledgeRetrieve
          effect: allow
          enabled: true
        - id: assemble-context
          tenantId: tenant-a
          actionType: contextAssemble
          effect: allow
          enabled: true
        - id: revoke-context
          tenantId: tenant-a
          actionType: contextOperation
          effect: allow
          enabled: true
      mcpSessions:
        maxSessions: 64
        maxStreams: 32
      a2aObjects:
        storage:
          type: sqlite
          path: ${AISP_EXAMPLE_STATE_DIR}/multi-agent-workflow/tasks.sqlite
          namespace: multi-agent-workflow
          busyTimeoutMillis: 100
        maxTasks: 256
        retentionSeconds: 86400
        maxStreams: 16
      dependencyEgress:
        requireTls: false
        destinations:
          embedding:
            - 127.0.0.1:18001
          qdrant:
            - 127.0.0.1:6333
      crossComponent:
        namespace: multi-agent-workflow
        ttlSeconds: 300
        maxContexts: 128
        storage:
          path: ${AISP_EXAMPLE_STATE_DIR}/multi-agent-workflow/contexts.jsonl
          maxBytes: 16777216
        destinations:
          - classification: public
            modelDestinations:
              - 127.0.0.1:18000
            toolDestinations:
              - local/echo
            agentDestinations:
              - 127.0.0.1:18100
          - classification: internal
            modelDestinations:
              - 127.0.0.1:18000
            toolDestinations:
              - local/echo
            agentDestinations:
              - 127.0.0.1:18100
          - classification: restricted
            modelDestinations:
              - 127.0.0.1:18000
            toolDestinations:
              - local/echo
            agentDestinations:
              - 127.0.0.1:18100
    llm:
      port: 14100
      policies:
        jwtAuth: &strict-jwt
          mode: strict
          issuer: ${AISP_EXAMPLE_ISSUER}
          audiences:
            - multi-agent-workflow
          jwks:
            file: ${AISP_EXAMPLE_JWKS_FILE}
      models:
        - name: local-model
          provider: openAI
          params:
            baseUrl: http://127.0.0.1:18000/v1
    mcp:
      port: 14102
      statefulMode: stateful
      policies:
        jwtAuth: *strict-jwt
      targets:
        - name: local
          mcp:
            host: http://127.0.0.1:18200/mcp
    a2a:
      port: 14101
      backend:
        host: 127.0.0.1:18100
    rag:
      port: 14103
      authentication: *strict-jwt
      qdrant:
        endpoint: http://127.0.0.1:6333
        collection: multi-agent-workflow
        quarantineCollection: multi-agent-workflow-quarantine
        defaultChunkAccess:
          allowTenantAuthenticated: true
        integrity:
          keyId: multi-agent-workflow
          keyEnvVar: AISP_EXAMPLE_VECTOR_KEY
      embedding:
        endpoint: http://127.0.0.1:18001/v1/embeddings
        model: local-embedding
      lifecycle:
        namespace: multi-agent-workflow
        storage:
          path: ${AISP_EXAMPLE_STATE_DIR}/multi-agent-workflow/documents.jsonl
          maxBytes: 16777216
      contextGuard:
        mode: enforce
        ruleSet: contextual
policies:
  - name:
      name: multi-agent-workflow-jwt
      namespace: internal
    target:
      route:
        name: ai-system:multi-agent-workflow:a2a:request
        namespace: internal
    policy:
      jwtAuth: *strict-jwt
